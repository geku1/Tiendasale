<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ranking de Juegos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/estilos.css">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold">
            Ranking de Juegos
        </a>

        <a href="index.html" class="btn btn-outline-light">
            Inicio
        </a>

    </div>

</nav>


<div class="container py-5">

    <!-- CABECERA -->
    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Top Videojuegos
        </h1>

        <p class="text-secondary">
            Ranking generado automáticamente según la puntuación de cada videojuego.
        </p>

    </div>

    <!-- FILTROS -->
    <div class="ranking-filtros mb-5">

        <div class="row g-3 align-items-end">

            <div class="col-md-4">

                <label for="filtroLetra" class="form-label">
                    Filtrar por letra
                </label>

                <input
                    type="text"
                    id="filtroLetra"
                    class="form-control"
                    placeholder="Ej: M">

            </div>

            <div class="col-md-4">

                <label for="filtroPuntuacion" class="form-label">
                    Puntuación mínima
                </label>

                <input
                    type="number"
                    id="filtroPuntuacion"
                    class="form-control"
                    min="0"
                    max="10">

            </div>

            <div class="col-md-4">

                <label for="filtroPrecio" class="form-label">
                    Ordenar por precio
                </label>

                <select
                    id="filtroPrecio"
                    class="form-select">

                    <option value="">
                        Sin ordenar
                    </option>

                    <option value="asc">
                        Menor a mayor
                    </option>

                    <option value="desc">
                        Mayor a menor
                    </option>

                </select>

            </div>

        </div>

        <div class="text-center mt-4">

            <button
                class="btn btn-primary px-5"
                onclick="cargarRanking()">

                Aplicar filtros

            </button>

        </div>

    </div>

    <!-- RESULTADOS -->
    <div id="rankingContainer" class="row g-4">

    </div>

</div>

        <p class="text-secondary">
            Ranking generado automáticamente según la puntuación de cada videojuego.
        </p>

    </div>

    <div id="rankingContainer" class="row g-4">

    </div>

</div>

<script src="js/ranking.js"></script>

</body>

</html>
